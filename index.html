<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Entre Clicks — Eternize esse momento</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        :root {
            --preto: #0a0a0a;
            --preto-2: #141414;
            --grafite: #1c1c1c;
            --cinza: #2a2a2a;
            --dourado: #d4af7a;
            --dourado-claro: #e8c99a;
            --dourado-escuro: #a88855;
            --branco: #f5f5f5;
            --cinza-suave: #888;
            --whatsapp: #25D366;
            --instagram: #E4405F;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: 
                radial-gradient(ellipse at top, #1a1a1a 0%, var(--preto) 70%),
                var(--preto);
            color: var(--branco);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px 60px 12px;
            font-weight: 300;
            letter-spacing: 0.3px;
            min-height: 100vh;
        }

        /* ================================
           HEADER / MARCA
        ================================ */
        .marca {
            text-align: center;
            margin: 8px 0 12px 0;
            animation: fadeInDown 0.8s ease;
        }

        .marca-logo {
            font-family: 'Playfair Display', serif;
            font-weight: 500;
            font-size: 22px;
            color: var(--dourado);
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        .marca-linha {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 4px;
            opacity: 0.7;
        }

        .marca-linha::before,
        .marca-linha::after {
            content: '';
            width: 30px;
            height: 1px;
            background: var(--dourado);
        }

        .marca-subtitulo {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 11px;
            color: var(--dourado-claro);
            letter-spacing: 2px;
            text-transform: lowercase;
        }

        /* ================================
           TELA DE ESCOLHA
        ================================ */
        .tela-escolha {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
            flex: 1;
            width: 100%;
            max-width: 380px;
            padding: 20px 10px;
            animation: fadeIn 0.6s ease;
        }

        .titulo-secao {
            text-align: center;
            margin-bottom: 8px;
        }

        .titulo-secao h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 400;
            font-size: 26px;
            color: var(--branco);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .titulo-secao h1 em {
            font-style: italic;
            color: var(--dourado);
            font-weight: 500;
        }

        .titulo-secao p {
            color: var(--cinza-suave);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .btn-escolha {
            width: 100%;
            padding: 22px 20px;
            background: linear-gradient(135deg, var(--grafite), var(--preto-2));
            border: 1px solid rgba(212, 175, 122, 0.3);
            border-radius: 4px;
            color: var(--branco);
            cursor: pointer;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            gap: 18px;
            position: relative;
            overflow: hidden;
        }

        .btn-escolha::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 122, 0.1), transparent);
            transition: left 0.6s;
        }

        .btn-escolha:hover::before,
        .btn-escolha:active::before {
            left: 100%;
        }

        .btn-escolha:hover,
        .btn-escolha:active {
            border-color: var(--dourado);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(212, 175, 122, 0.15);
        }

        .btn-escolha .icone {
            width: 44px;
            height: 44px;
            border: 1px solid var(--dourado);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--dourado);
            transition: all 0.3s ease;
        }

        .btn-escolha:hover .icone {
            background: var(--dourado);
            color: var(--preto);
        }

        .btn-escolha .icone svg {
            width: 22px;
            height: 22px;
        }

        .btn-escolha .texto {
            display: flex;
            flex-direction: column;
            gap: 3px;
            text-align: left;
            flex: 1;
        }

        .btn-escolha .titulo-btn {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
            color: var(--branco);
        }

        .btn-escolha .desc {
            font-size: 11px;
            color: var(--cinza-suave);
            letter-spacing: 0.5px;
            font-weight: 300;
        }

        /* ================================
           CONTAINER (câmera / ajuste / resultado)
        ================================ */
        .container {
            position: relative;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 2000 / 2666;
            background: var(--preto-2);
            border: 1px solid rgba(212, 175, 122, 0.2);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease;
        }

        #video {
            position: absolute;
            object-fit: cover;
            display: block;
        }

        #canvasResultado {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .area-ajuste {
            position: absolute;
            overflow: hidden;
            background: var(--cinza);
            touch-action: none;
            cursor: grab;
        }

        .area-ajuste:active { cursor: grabbing; }

        #fotoAjuste {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            will-change: transform;
            pointer-events: none;
            max-width: none;
            max-height: none;
        }

        .moldura-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* ================================
           BOTÕES DE AÇÃO
        ================================ */
        .botoes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 380px;
            padding: 5px 0;
        }

        .btn {
            background: var(--grafite);
            color: var(--branco);
            border: 1px solid rgba(212, 175, 122, 0.25);
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-radius: 3px;
            cursor: pointer;
            flex: 1;
            min-width: 100px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover:not(:disabled),
        .btn:active {
            background: var(--preto-2);
            border-color: var(--dourado);
            color: var(--dourado);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn svg { width: 14px; height: 14px; }

        .btn-voltar {
            background: transparent;
            border-color: rgba(255,255,255,0.15);
            color: var(--cinza-suave);
            flex: 0 0 auto;
            min-width: 90px;
        }

        .btn-voltar:hover:not(:disabled) {
            border-color: rgba(255,255,255,0.4);
            color: var(--branco);
            background: transparent;
        }

        .btn-primario {
            background: linear-gradient(135deg, var(--dourado), var(--dourado-escuro));
            color: var(--preto);
            border: none;
            font-weight: 600;
        }

        .btn-primario:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--dourado-claro), var(--dourado));
            color: var(--preto);
            box-shadow: 0 4px 20px rgba(212, 175, 122, 0.4);
        }

        .btn-enviar-impressao {
            background: linear-gradient(135deg, var(--dourado), var(--dourado-escuro));
            color: var(--preto);
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            flex: 1 1 100%;
            box-shadow: 0 4px 20px rgba(212, 175, 122, 0.25);
            position: relative;
            overflow: hidden;
        }

        .btn-enviar-impressao::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.7s;
        }

        .btn-enviar-impressao:hover::before {
            left: 100%;
        }

        .btn-enviar-impressao:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--dourado-claro), var(--dourado));
            box-shadow: 0 6px 30px rgba(212, 175, 122, 0.5);
        }

        .hidden { display: none !important; }

        #mensagem {
            padding: 5px;
            text-align: center;
            color: var(--dourado);
            font-size: 11px;
            min-height: 20px;
            letter-spacing: 1px;
            font-style: italic;
            font-family: 'Playfair Display', serif;
        }

        #inputFoto { display: none; }

        .dica-ajuste {
            text-align: center;
            color: var(--cinza-suave);
            font-size: 10px;
            margin-top: 4px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .dica-ajuste .separador {
            color: var(--dourado);
            margin: 0 8px;
        }

        /* ================================
           LOADING INICIAL
        ================================ */
        .loading-inicial {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--preto);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            gap: 24px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 1px solid rgba(212, 175, 122, 0.15);
            border-top: 1px solid var(--dourado);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-inicial .marca-logo {
            font-size: 18px;
            letter-spacing: 8px;
            opacity: 0.9;
        }

        .loading-inicial p {
            color: var(--cinza-suave);
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 300;
        }

        /* ================================
           MODAL
        ================================ */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal-conteudo {
            background: linear-gradient(135deg, var(--grafite), var(--preto-2));
            color: var(--branco);
            padding: 40px 30px 30px 30px;
            border: 1px solid rgba(212, 175, 122, 0.3);
            border-radius: 6px;
            text-align: center;
            max-width: 360px;
            width: 100%;
            animation: slideUp 0.4s ease;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .modal-conteudo::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--dourado), transparent);
        }

        .modal-icone {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            border: 1px solid var(--dourado);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dourado);
        }

        .modal-icone svg {
            width: 28px;
            height: 28px;
        }

        .modal-titulo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 500;
            margin-bottom: 12px;
            color: var(--branco);
        }

        .modal-texto {
            font-size: 13px;
            color: var(--cinza-suave);
            line-height: 1.7;
            margin-bottom: 24px;
            font-weight: 300;
        }

        .modal-texto small {
            font-size: 10px;
            opacity: 0.6;
        }

        .modal button.btn-ok {
            background: linear-gradient(135deg, var(--dourado), var(--dourado-escuro));
            color: var(--preto);
            padding: 12px 40px;
            border-radius: 3px;
            border: none;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .modal button.btn-ok:hover {
            background: linear-gradient(135deg, var(--dourado-claro), var(--dourado));
            box-shadow: 0 4px 20px rgba(212, 175, 122, 0.4);
        }

        /* ================================
           MODAL: CTA REDES SOCIAIS
        ================================ */
        .modal-cta {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(212, 175, 122, 0.15);
        }

        .modal-cta-titulo {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 13px;
            color: var(--dourado-claro);
            margin-bottom: 4px;
        }

        .modal-cta-subtitulo {
            font-size: 10px;
            color: var(--cinza-suave);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .modal-cta-botoes {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-cta-botoes a {
            width: 44px;
            height: 44px;
            border: 1px solid rgba(212, 175, 122, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dourado);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .modal-cta-botoes a svg {
            width: 20px;
            height: 20px;
        }

        .modal-cta-botoes a.whats:hover {
            background: var(--whatsapp);
            border-color: var(--whatsapp);
            color: var(--branco);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.4);
        }

        .modal-cta-botoes a.insta:hover {
            background: linear-gradient(135deg, #833AB4, #FD1D1D, #FCB045);
            border-color: transparent;
            color: var(--branco);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(228, 64, 95, 0.4);
        }

        /* ================================
           RODAPÉ FIXO COM REDES
        ================================ */
        .rodape {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px 12px;
            background: linear-gradient(180deg, transparent, rgba(0,0,0,0.7) 50%, rgba(0,0,0,0.95));
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 100;
            pointer-events: none;
        }

        .rodape-marca {
            font-family: 'Playfair Display', serif;
            font-size: 9px;
            color: rgba(212, 175, 122, 0.5);
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 400;
        }

        .rodape-redes {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        .rodape-redes a {
            width: 30px;
            height: 30px;
            border: 1px solid rgba(212, 175, 122, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(212, 175, 122, 0.7);
            text-decoration: none;
            transition: all 0.3s ease;
            background: rgba(20, 20, 20, 0.6);
        }

        .rodape-redes a svg {
            width: 14px;
            height: 14px;
        }

        .rodape-redes a.whats:hover {
            background: var(--whatsapp);
            border-color: var(--whatsapp);
            color: var(--branco);
            transform: translateY(-2px);
        }

        .rodape-redes a.insta:hover {
            background: linear-gradient(135deg, #833AB4, #FD1D1D, #FCB045);
            border-color: transparent;
            color: var(--branco);
            transform: translateY(-2px);
        }

                /* ================================
           OVERLAY DE ENVIO (barra de progresso)
        ================================ */
        .overlay-envio {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .overlay-envio.ativo {
            display: flex;
        }

        .envio-conteudo {
            max-width: 340px;
            width: 100%;
            text-align: center;
        }

        .envio-icone {
            width: 60px;
            height: 60px;
            margin: 0 auto 24px;
            border: 1px solid var(--dourado);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dourado);
            position: relative;
            animation: pulseGlow 2s ease-in-out infinite;
        }

        .envio-icone svg {
            width: 28px;
            height: 28px;
        }

        .envio-titulo {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 500;
            color: var(--branco);
            margin-bottom: 6px;
        }

        .envio-subtitulo {
            font-size: 10px;
            color: var(--cinza-suave);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .barra-progresso {
            width: 100%;
            height: 6px;
            background: rgba(212, 175, 122, 0.1);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            margin-bottom: 16px;
        }

        .barra-progresso-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--dourado-escuro), var(--dourado), var(--dourado-claro));
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .barra-progresso-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 1.8s infinite;
        }

        .envio-percentual {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 400;
            color: var(--dourado);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .envio-mensagem {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 13px;
            color: var(--dourado-claro);
            letter-spacing: 1px;
            min-height: 22px;
            transition: opacity 0.3s ease;
        }

        @keyframes shimmer {
            0%   { left: -100%; }
            100% { left: 100%; }
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(212, 175, 122, 0.4);
            }
            50% {
                box-shadow: 0 0 0 15px rgba(212, 175, 122, 0);
            }
        }

        /* ================================
           ANIMAÇÕES
        ================================ */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 360px) {
            .marca-logo { font-size: 18px; letter-spacing: 4px; }
            .titulo-secao h1 { font-size: 22px; }
            .btn-escolha { padding: 18px 16px; }
            .btn-escolha .titulo-btn { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- LOADING INICIAL -->
    <div id="loadingInicial" class="loading-inicial">
        <div class="marca-logo">ENTRE CLICKS</div>
        <div class="loading-spinner"></div>
        <p>Carregando</p>
    </div>

    <!-- MARCA -->
    <div class="marca">
        <div class="marca-logo">ENTRE CLICKS</div>
        <div class="marca-linha">
            <span class="marca-subtitulo">momentos eternos</span>
        </div>
    </div>

    <!-- TELA DE ESCOLHA -->
    <div class="tela-escolha hidden" id="telaEscolha">
        <div class="titulo-secao">
            <h1>Eternize <em>este</em> momento</h1>
            <p>escolha como registrar</p>
        </div>

        const inputFoto = document.getElementById('inputFoto');
        const mensagem = document.getElementById('mensagem');

        const moldura = new Image();
        moldura.crossOrigin = 'anonymous';

        let cameraAtual = 'environment';
        let streamAtual = null;
        let imagemOriginal = null;
        let fotoJaEnviada = false;
        
        let ajuste = { x: 0, y: 0, scale: 1, initialScale: 1 };

        // ============================================
        // CARREGA CONFIGURAÇÃO DO SUPABASE
        // ============================================
        async function carregarConfiguracao() {
            try {
                const { data, error } = await supabaseClient
                    .from('configuracao')
                    .select('*')
                    .order('id', { ascending: false })
                    .limit(1)
                    .single();

                if (error) throw error;
                if (!data) throw new Error('Sem configuração cadastrada');

                MOLDURA.janelaX = data.janela_x;
                MOLDURA.janelaY = data.janela_y;
                MOLDURA.janelaLargura = data.janela_largura;
                MOLDURA.janelaAltura = data.janela_altura;
                MOLDURA.arquivo = data.moldura_url;

                molduraCamera.src = data.moldura_url;
                molduraAjuste.src = data.moldura_url;
                moldura.src = data.moldura_url;

                await new Promise((resolve, reject) => {
                    if (moldura.complete && moldura.naturalWidth > 0) {
                        MOLDURA.larguraTotal = moldura.naturalWidth;
                        MOLDURA.alturaTotal = moldura.naturalHeight;
                        resolve();
                    } else {
                        moldura.onload = () => {
                            MOLDURA.larguraTotal = moldura.naturalWidth;
                            MOLDURA.alturaTotal = moldura.naturalHeight;
                            resolve();
                        };
                        moldura.onerror = () => reject(new Error('Falha ao carregar imagem da moldura'));
                    }
                });

                aplicarProporcaoMoldura();
                aplicarPosicoesJanela();

                console.log('✅ Configuração carregada');
                return true;
            } catch (err) {
                console.error('Erro ao carregar configuração:', err);
                mostrarModal('erro', 'Erro', 
                    'Não foi possível carregar a configuração. Recarregue a página.<br><br><small>' + err.message + '</small>');
                return false;
            }
        }

        function aplicarProporcaoMoldura() {
            const containers = document.querySelectorAll('.container');
            const proporcao = `${MOLDURA.larguraTotal} / ${MOLDURA.alturaTotal}`;
            containers.forEach(c => c.style.aspectRatio = proporcao);
        }

        function aplicarPosicoesJanela() {
            const topPct = (MOLDURA.janelaY / MOLDURA.alturaTotal) * 100;
            const leftPct = (MOLDURA.janelaX / MOLDURA.larguraTotal) * 100;
            const widthPct = (MOLDURA.janelaLargura / MOLDURA.larguraTotal) * 100;
            const heightPct = (MOLDURA.janelaAltura / MOLDURA.alturaTotal) * 100;

            video.style.cssText = `
                position: absolute;
                top: ${topPct}%;
                left: ${leftPct}%;
                width: ${widthPct}%;
                height: ${heightPct}%;
                object-fit: cover;
                display: block;
                transform: ${cameraAtual === 'user' ? 'scaleX(-1)' : 'none'};
            `;

            areaFoto.style.cssText = `
                position: absolute;
                top: ${topPct}%;
                left: ${leftPct}%;
                width: ${widthPct}%;
                height: ${heightPct}%;
                overflow: hidden;
                background: #2a2a2a;
                touch-action: none;
                cursor: grab;
            `;
        }

        function mostrarTela(tela) {
            telaEscolha.classList.add('hidden');
            areaCamera.classList.add('hidden');
            areaAjuste.classList.add('hidden');
            areaResultado.classList.add('hidden');
            botoesCamera.classList.add('hidden');
            botoesAjuste.classList.add('hidden');
            botoesResultado.classList.add('hidden');
            dicaAjuste.classList.add('hidden');

            if (tela === 'escolha') {
                telaEscolha.classList.remove('hidden');
                pararCamera();
                fotoJaEnviada = false;
            } else if (tela === 'camera') {
                areaCamera.classList.remove('hidden');
                botoesCamera.classList.remove('hidden');
            } else if (tela === 'ajuste') {
                areaAjuste.classList.remove('hidden');
                botoesAjuste.classList.remove('hidden');
                dicaAjuste.classList.remove('hidden');
                pararCamera();
            } else if (tela === 'resultado') {
                areaResultado.classList.remove('hidden');
                botoesResultado.classList.remove('hidden');
                pararCamera();
                btnEnviarImpressao.disabled = false;
                btnEnviarImpressao.textContent = 'Enviar para impressão';
                btnEnviarImpressao.style.display = fotoJaEnviada ? 'none' : 'inline-flex';
            }
        }

        btnAbrirCamera.addEventListener('click', () => {
            mostrarTela('camera');
            iniciarCamera();
        });

        btnAbrirGaleria.addEventListener('click', () => {
            inputFoto.click();
        });

        inputFoto.addEventListener('change', (e) => {
            const arquivo = e.target.files[0];
            if (!arquivo) return;

            mensagem.textContent = 'Carregando foto...';
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    imagemOriginal = img;
                    mostrarTela('ajuste');
                    setTimeout(() => {
                        iniciarAjuste();
                        mensagem.textContent = '';
                    }, 100);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(arquivo);
        });

        function iniciarAjuste() {
            fotoAjuste.src = imagemOriginal.src;
            fotoAjuste.style.width = imagemOriginal.width + 'px';
            fotoAjuste.style.height = imagemOriginal.height + 'px';

            const rectArea = areaFoto.getBoundingClientRect();
            
            if (rectArea.width === 0 || rectArea.height === 0) {
                setTimeout(iniciarAjuste, 100);
                return;
            }

            const scaleX = rectArea.width / imagemOriginal.width;
            const scaleY = rectArea.height / imagemOriginal.height;
            const scaleCover = Math.max(scaleX, scaleY);

            ajuste.scale = scaleCover;
            ajuste.initialScale = scaleCover;
            ajuste.x = (rectArea.width - imagemOriginal.width * scaleCover) / 2;
            ajuste.y = (rectArea.height - imagemOriginal.height * scaleCover) / 2;

            aplicarTransform();
        }

        function aplicarTransform() {
            fotoAjuste.style.transform = 
                `translate(${ajuste.x}px, ${ajuste.y}px) scale(${ajuste.scale})`;
        }

        // GESTOS
        let toqueInicial = null;
        let distanciaInicial = 0;
        let scaleInicial = 1;
        let ajusteInicial = { x: 0, y: 0 };

        function getDistancia(t) {
            const dx = t[0].clientX - t[1].clientX;
            const dy = t[0].clientY - t[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function getCentro(t) {
            return {
                x: (t[0].clientX + t[1].clientX) / 2,
                y: (t[0].clientY + t[1].clientY) / 2
            };
        }

        areaFoto.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length === 1) {
                toqueInicial = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                ajusteInicial = { x: ajuste.x, y: ajuste.y };
            } else if (e.touches.length === 2) {
                distanciaInicial = getDistancia(e.touches);
                scaleInicial = ajuste.scale;
                toqueInicial = getCentro(e.touches);
                ajusteInicial = { x: ajuste.x, y: ajuste.y };
            }
        }, { passive: false });

        areaFoto.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && toqueInicial) {
                const dx = e.touches[0].clientX - toqueInicial.x;
                const dy = e.touches[0].clientY - toqueInicial.y;
                ajuste.x = ajusteInicial.x + dx;
                ajuste.y = ajusteInicial.y + dy;
                aplicarTransform();
            } else if (e.touches.length === 2 && distanciaInicial > 0) {
                const novaDistancia = getDistancia(e.touches);
                const escalaFator = novaDistancia / distanciaInicial;
                const novoScale = Math.max(
                    ajuste.initialScale * 0.5,
                    Math.min(scaleInicial * escalaFator, ajuste.initialScale * 5)
                );
                
                const centroAtual = getCentro(e.touches);
                const rectArea = areaFoto.getBoundingClientRect();
                const cx = centroAtual.x - rectArea.left;
                const cy = centroAtual.y - rectArea.top;
                
                const scaleDiff = novoScale / scaleInicial;
                ajuste.x = cx - (cx - ajusteInicial.x) * scaleDiff;
                ajuste.y = cy - (cy - ajusteInicial.y) * scaleDiff;
                ajuste.scale = novoScale;
                
                aplicarTransform();
            }
        }, { passive: false });

        areaFoto.addEventListener('touchend', (e) => {
            if (e.touches.length === 0) {
                toqueInicial = null;
                distanciaInicial = 0;
            }
        });

        let mouseDown = false;
        areaFoto.addEventListener('mousedown', (e) => {
            mouseDown = true;
            toqueInicial = { x: e.clientX, y: e.clientY };
            ajusteInicial = { x: ajuste.x, y: ajuste.y };
        });
        areaFoto.addEventListener('mousemove', (e) => {
            if (!mouseDown) return;
            const dx = e.clientX - toqueInicial.x;
            const dy = e.clientY - toqueInicial.y;
            ajuste.x = ajusteInicial.x + dx;
            ajuste.y = ajusteInicial.y + dy;
            aplicarTransform();
        });
        areaFoto.addEventListener('mouseup', () => { mouseDown = false; });
        areaFoto.addEventListener('mouseleave', () => { mouseDown = false; });
        areaFoto.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const novoScale = Math.max(
                ajuste.initialScale * 0.5,
                Math.min(ajuste.scale * delta, ajuste.initialScale * 5)
            );
            const rectArea = areaFoto.getBoundingClientRect();
            const cx = e.clientX - rectArea.left;
            const cy = e.clientY - rectArea.top;
            const scaleDiff = novoScale / ajuste.scale;
            ajuste.x = cx - (cx - ajuste.x) * scaleDiff;
            ajuste.y = cy - (cy - ajuste.y) * scaleDiff;
            ajuste.scale = novoScale;
            aplicarTransform();
        }, { passive: false });

        btnVoltarAjuste.addEventListener('click', () => {
            inputFoto.value = '';
            mostrarTela('escolha');
        });

        btnResetAjuste.addEventListener('click', iniciarAjuste);

        btnConfirmarAjuste.addEventListener('click', () => {
            canvas.width = MOLDURA.larguraTotal;
            canvas.height = MOLDURA.alturaTotal;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const rectArea = areaFoto.getBoundingClientRect();
            
            // ⭐ USA UMA ÚNICA PROPORÇÃO (baseada na largura)
            // Isso garante que a imagem NÃO seja distorcida
            const prop = MOLDURA.janelaLargura / rectArea.width;

            ctx.save();
            ctx.beginPath();
            ctx.rect(MOLDURA.janelaX, MOLDURA.janelaY, MOLDURA.janelaLargura, MOLDURA.janelaAltura);
            ctx.clip();
            ctx.translate(MOLDURA.janelaX, MOLDURA.janelaY);
            ctx.translate(ajuste.x * prop, ajuste.y * prop);
            ctx.scale(ajuste.scale * prop, ajuste.scale * prop);
            ctx.drawImage(imagemOriginal, 0, 0);
            ctx.restore();

            if (moldura.complete && moldura.naturalWidth > 0) {
                ctx.drawImage(moldura, 0, 0, MOLDURA.larguraTotal, MOLDURA.alturaTotal);
            }
            fotoJaEnviada = false;
            mostrarTela('resultado');
        });

        async function iniciarCamera() {
            try {
                mensagem.textContent = 'Iniciando câmera...';
                if (streamAtual) {
                    streamAtual.getTracks().forEach(t => t.stop());
                    streamAtual = null;
                }
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: cameraAtual,
                        width: { ideal: 1920 },
                        height: { ideal: 2322 }
                    },
                    audio: false
                });
                streamAtual = stream;
                video.srcObject = stream;
                
                if (cameraAtual === 'user') {
                    video.style.transform = 'scaleX(-1)';
                } else {
                    video.style.transform = 'none';
                }
                
                video.onloadedmetadata = () => {
                    video.play();
                    mensagem.textContent = '';
                };
            } catch (err) {
                mensagem.textContent = 'Erro: ' + err.message;
            }
        }

        function pararCamera() {
            if (streamAtual) {
                streamAtual.getTracks().forEach(t => t.stop());
                streamAtual = null;
            }
        }

        btnVoltarCamera.addEventListener('click', () => mostrarTela('escolha'));
        btnVirarCamera.addEventListener('click', () => {
            cameraAtual = cameraAtual === 'environment' ? 'user' : 'environment';
            iniciarCamera();
        });

        btnTirarFoto.addEventListener('click', () => {
            if (!video.videoWidth) {
                alert('Câmera ainda não está pronta.');
                return;
            }
            canvas.width = MOLDURA.larguraTotal;
            canvas.height = MOLDURA.alturaTotal;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const propJ = MOLDURA.janelaLargura / MOLDURA.janelaAltura;
            const propC = video.videoWidth / video.videoHeight;
            let sx, sy, sW, sH;

            if (propC > propJ) {
                sH = video.videoHeight;
                sW = video.videoHeight * propJ;
                sx = (video.videoWidth - sW) / 2;
                sy = 0;
            } else {
                sW = video.videoWidth;
                sH = video.videoWidth / propJ;
                sx = 0;
                sy = (video.videoHeight - sH) / 2;
            }

            ctx.drawImage(video, sx, sy, sW, sH,
                MOLDURA.janelaX, MOLDURA.janelaY,
                MOLDURA.janelaLargura, MOLDURA.janelaAltura);

            if (moldura.complete && moldura.naturalWidth > 0) {
                ctx.drawImage(moldura, 0, 0, MOLDURA.larguraTotal, MOLDURA.alturaTotal);
            }
            fotoJaEnviada = false;
            mostrarTela('resultado');
        });

        btnRefazer.addEventListener('click', () => {
            inputFoto.value = '';
            mostrarTela('escolha');
        });

        btnBaixar.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'entreclicks-' + Date.now() + '.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });

        btnCompartilhar.addEventListener('click', async () => {
            try {
                canvas.toBlob(async (blob) => {
                    const arquivo = new File(
                        [blob], 
                        'entreclicks-' + Date.now() + '.jpg',
                        { type: 'image/jpeg' }
                    );

                    if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
                        await navigator.share({
                            files: [arquivo],
                            title: 'Entre Clicks',
                            text: 'Eternize esse momento'
                        });
                    } else {
                        alert('Seu navegador não suporta compartilhamento direto. Vamos baixar a foto pra você compartilhar manualmente.');
                        btnBaixar.click();
                    }
                }, 'image/jpeg', 0.95);
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error(err);
                    alert('Não foi possível compartilhar. Tente baixar a foto.');
                }
            }
        });

               btnEnviarImpressao.addEventListener('click', async () => {
            if (fotoJaEnviada) {
                mostrarModal('info', 'Foto já enviada', 'Essa foto já foi enviada para impressão!');
                return;
            }

            const overlay = document.getElementById('overlayEnvio');
            const barraFill = document.getElementById('barraFill');
            const percentualEl = document.getElementById('envioPercentual');
            const mensagemEl = document.getElementById('envioMensagem');

            // Mensagens que mudam durante o envio
            const mensagens = [
                { pct: 0,   texto: 'Preparando sua foto...' },
                { pct: 20,  texto: 'Otimizando qualidade...' },
                { pct: 50,  texto: 'Enviando para impressão...' },
                { pct: 80,  texto: 'Quase lá...' },
                { pct: 95,  texto: 'Finalizando...' }
            ];

            function atualizarProgresso(pct) {
                barraFill.style.width = pct + '%';
                percentualEl.textContent = Math.round(pct) + '%';
                
                // Atualiza mensagem baseada no progresso
                for (let i = mensagens.length - 1; i >= 0; i--) {
                    if (pct >= mensagens[i].pct) {
                        if (mensagemEl.textContent !== mensagens[i].texto) {
                            mensagemEl.style.opacity = '0';
                            setTimeout(() => {
                                mensagemEl.textContent = mensagens[i].texto;
                                mensagemEl.style.opacity = '1';
                            }, 200);
                        }
                        break;
                    }
                }
            }

            // Mostra o overlay
            overlay.classList.add('ativo');
            atualizarProgresso(0);
            btnEnviarImpressao.disabled = true;

            // Simula progresso enquanto processa (0-30%)
            let progressoSimulado = 0;
            const intervalSimulado = setInterval(() => {
                progressoSimulado += Math.random() * 3;
                if (progressoSimulado >= 30) {
                    progressoSimulado = 30;
                    clearInterval(intervalSimulado);
                }
                atualizarProgresso(progressoSimulado);
            }, 100);

            try {
                // Gera o blob (rápido)
                const blob = await new Promise((resolve) => {
                    canvas.toBlob(resolve, 'image/jpeg', 0.95);
                });

                if (!blob) throw new Error('Erro ao gerar foto');

                clearInterval(intervalSimulado);
                atualizarProgresso(35);

                const timestamp = Date.now();
                const random = Math.random().toString(36).substring(2, 8);
                const nomeArquivo = `foto-${timestamp}-${random}.jpg`;

                // Simula progresso durante upload (35-90%)
                let progressoUpload = 35;
                const intervalUpload = setInterval(() => {
                    progressoUpload += Math.random() * 4;
                    if (progressoUpload >= 90) {
                        progressoUpload = 90;
                        clearInterval(intervalUpload);
                    }
                    atualizarProgresso(progressoUpload);
                }, 150);

                // Upload real pro Supabase
                const { error } = await supabaseClient
                    .storage
                    .from(BUCKET_FOTOS)
                    .upload(nomeArquivo, blob, {
                        cacheControl: '3600',
                        upsert: false,
                        contentType: 'image/jpeg'
                    });

                clearInterval(intervalUpload);

                if (error) throw error;

                // Completa 100% suavemente
                atualizarProgresso(100);

                // Aguarda um instante pra mostrar o 100%
                await new Promise(r => setTimeout(r, 600));

                fotoJaEnviada = true;
                btnEnviarImpressao.style.display = 'none';
                overlay.classList.remove('ativo');
                
                // Modal de sucesso
                mostrarModal(
                    'sucesso',
                    'Foto enviada',
                    'Sua foto será impressa e entregue durante o evento.<br><br>Você também pode baixar ou compartilhar sua foto agora.',
                    true
                );

            } catch (err) {
                console.error('Erro upload:', err);
                clearInterval(intervalSimulado);
                overlay.classList.remove('ativo');
                btnEnviarImpressao.disabled = false;
                btnEnviarImpressao.textContent = 'Enviar para impressão';
                
                mostrarModal(
                    'erro',
                    'Algo deu errado',
                    'Não foi possível enviar. Verifique sua internet e tente novamente.<br><br><small>' + err.message + '</small>'
                );
            }
        });

        // ============================================
        // MODAL — Agora com opção de CTA (redes sociais)
        // ============================================
        function mostrarModal(tipo, titulo, texto, mostrarCTA = false) {
            const modalExistente = document.querySelector('.modal');
            if (modalExistente) modalExistente.remove();

            const icone = ICONES_MODAL[tipo] || ICONES_MODAL.info;

            const ctaHTML = mostrarCTA ? `
                <div class="modal-cta">
                    <div class="modal-cta-titulo">Gostou da experiência?</div>
                    <div class="modal-cta-subtitulo">conheça a Entre Clicks</div>
                    <div class="modal-cta-botoes">
                        <a href="https://wa.me/5528999281772" target="_blank" rel="noopener" class="whats" title="WhatsApp">
                            ${ICONE_WHATS}
                        </a>
                        <a href="https://instagram.com/entreclicks.oficial" target="_blank" rel="noopener" class="insta" title="Instagram">
                            ${ICONE_INSTA}
                        </a>
                    </div>
                </div>
            ` : '';

            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-conteudo">
                    <div class="modal-icone">${icone}</div>
                    <div class="modal-titulo">${titulo}</div>
                    <div class="modal-texto">${texto}</div>
                    <button class="btn-ok" onclick="this.closest('.modal').remove()">OK</button>
                    ${ctaHTML}
                </div>
            `;
            document.body.appendChild(modal);
        }

        // ============================================
        // INICIALIZAÇÃO
        // ============================================
        (async function inicializar() {
            const ok = await carregarConfiguracao();
            if (ok) {
                loadingInicial.style.display = 'none';
                mostrarTela('escolha');
            }
        })();
    </script>
