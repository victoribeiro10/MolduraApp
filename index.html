<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MolduraApp - Cecília 1 Aninho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        h1 {
            text-align: center;
            margin: 8px 0;
            font-size: 18px;
            color: #ff9ec7;
        }

        /* Container mantém a proporção EXATA da moldura: 2000x2666 = 3:4 */
        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 2000 / 2666;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        /* O vídeo fica posicionado exatamente na área da janela transparente */
        /* Janela: X=200/2000=10%, Y=87/2666=3.26%, W=1600/2000=80%, H=1936/2666=72.62% */
        #video {
            position: absolute;
            top: 3.26%;
            left: 10%;
            width: 80%;
            height: 72.62%;
            object-fit: cover;
            display: block;
        }

        #canvasResultado {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        video.espelhado {
            transform: scaleX(-1);
        }

        .moldura-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .botoes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 400px;
            padding: 5px 0;
        }

        button {
            background: #ff9ec7;
            color: white;
            border: none;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            flex: 1;
            min-width: 100px;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
            background: #ff7eb0;
        }

        .hidden {
            display: none !important;
        }

        #mensagem {
            padding: 5px;
            text-align: center;
            color: #ff9ec7;
            font-size: 12px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <h1>📸 Cecília - 1 Aninho</h1>
    <div id="mensagem">Iniciando...</div>

    <!-- Área da câmera -->
    <div class="container" id="areaCamera">
        <video id="video" autoplay playsinline muted></video>
        <img id="molduraImg" class="moldura-overlay" src="./Molduras/cecilia.png" alt="Moldura">
    </div>

    <!-- Área do resultado -->
    <div class="container hidden" id="areaResultado">
        <canvas id="canvasResultado"></canvas>
    </div>

    <div class="botoes">
        <button id="btnTirarFoto">📷 Tirar Foto</button>
        <button id="btnVirarCamera">🔄 Virar</button>
        <button id="btnRefazer" class="hidden">↩️ Refazer</button>
        <button id="btnBaixar" class="hidden">⬇️ Baixar</button>
    </div>

    <script>
        // ============================================
        // CONFIGURAÇÕES DA MOLDURA (Cecília)
        // ============================================
        const MOLDURA = {
            larguraTotal: 2000,   // largura total da moldura em px
            alturaTotal: 2666,    // altura total da moldura em px
            janelaX: 200,         // posição X onde começa a janela
            janelaY: 87,          // posição Y onde começa a janela  
            janelaLargura: 1600,  // largura da janela transparente
            janelaAltura: 1936,   // altura da janela transparente
            arquivo: './Molduras/cecilia.png'
        };

        // ============================================
        // ELEMENTOS DA PÁGINA
        // ============================================
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvasResultado');
        const ctx = canvas.getContext('2d');
        const molduraImg = document.getElementById('molduraImg');
        const areaCamera = document.getElementById('areaCamera');
        const areaResultado = document.getElementById('areaResultado');
        const btnTirarFoto = document.getElementById('btnTirarFoto');
        const btnVirarCamera = document.getElementById('btnVirarCamera');
        const btnRefazer = document.getElementById('btnRefazer');
        const btnBaixar = document.getElementById('btnBaixar');
        const mensagem = document.getElementById('mensagem');

        // ============================================
        // CARREGA A MOLDURA
        // ============================================
        const moldura = new Image();
        moldura.src = MOLDURA.arquivo;
        
        moldura.onload = () => {
            mensagem.textContent = '✅ Pronto!';
            setTimeout(() => { mensagem.textContent = ''; }, 1500);
        };
        
        moldura.onerror = () => {
            mensagem.textContent = '⚠️ Moldura não encontrada';
        };

        let cameraAtual = 'environment';
        let streamAtual = null;

        // ============================================
        // INICIA A CÂMERA
        // ============================================
        async function iniciarCamera() {
            try {
                mensagem.textContent = 'Iniciando câmera...';
                
                if (streamAtual) {
                    streamAtual.getTracks().forEach(track => track.stop());
                    streamAtual = null;
                }

                // Pede alta resolução com proporção da JANELA (1600/1936 ≈ 0.826)
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: cameraAtual,
                        width: { ideal: 1920 },
                        height: { ideal: 2322 } // mantém proporção da janela
                    },
                    audio: false
                });
                
                streamAtual = stream;
                video.srcObject = stream;
                
                // Espelha apenas o preview da câmera frontal
                if (cameraAtual === 'user') {
                    video.classList.add('espelhado');
                } else {
                    video.classList.remove('espelhado');
                }
                
                video.onloadedmetadata = () => {
                    video.play();
                    mensagem.textContent = '';
                    console.log('Resolução câmera:', video.videoWidth, 'x', video.videoHeight);
                };
                
            } catch (err) {
                mensagem.textContent = '❌ Erro: ' + err.message;
                console.error(err);
            }
        }

        // ============================================
        // BOTÃO: VIRAR CÂMERA
        // ============================================
        btnVirarCamera.addEventListener('click', () => {
            cameraAtual = cameraAtual === 'environment' ? 'user' : 'environment';
            iniciarCamera();
        });

        // ============================================
        // BOTÃO: TIRAR FOTO
        // Essa é a parte principal: monta a foto final em alta qualidade
        // ============================================
        btnTirarFoto.addEventListener('click', () => {
            if (!video.videoWidth) {
                alert('Câmera ainda não está pronta. Aguarde 1 segundo.');
                return;
            }

            // Define o canvas com o TAMANHO EXATO da moldura (2000x2666)
            canvas.width = MOLDURA.larguraTotal;
            canvas.height = MOLDURA.alturaTotal;

            // Fundo branco (caso a moldura tenha transparência em algum lugar)
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Calcula o crop da câmera pra caber exatamente na janela
            // Proporção da janela: 1600/1936 = 0.826
            const proporcaoJanela = MOLDURA.janelaLargura / MOLDURA.janelaAltura;
            const proporcaoCamera = video.videoWidth / video.videoHeight;

            let sx, sy, sWidth, sHeight;

            if (proporcaoCamera > proporcaoJanela) {
                // Câmera mais LARGA que a janela: corta as laterais
                sHeight = video.videoHeight;
                sWidth = video.videoHeight * proporcaoJanela;
                sx = (video.videoWidth - sWidth) / 2;
                sy = 0;
            } else {
                // Câmera mais ALTA que a janela: corta topo/baixo
                sWidth = video.videoWidth;
                sHeight = video.videoWidth / proporcaoJanela;
                sx = 0;
                sy = (video.videoHeight - sHeight) / 2;
            }

            // Se for câmera frontal, salva a foto NORMAL (não espelhada)
            // (o preview é espelhado, mas a foto final sai correta)
            
            // Desenha a câmera EXATAMENTE dentro da janela da moldura
            ctx.drawImage(
                video,
                sx, sy, sWidth, sHeight,           // origem (crop da câmera)
                MOLDURA.janelaX, MOLDURA.janelaY,  // destino no canvas
                MOLDURA.janelaLargura, MOLDURA.janelaAltura
            );

            // Desenha a moldura POR CIMA (cobre tudo, exceto a janela transparente)
            if (moldura.complete && moldura.naturalWidth > 0) {
                ctx.drawImage(moldura, 0, 0, MOLDURA.larguraTotal, MOLDURA.alturaTotal);
            }

            // Mostra o resultado
            areaCamera.classList.add('hidden');
            areaResultado.classList.remove('hidden');
            btnTirarFoto.classList.add('hidden');
            btnVirarCamera.classList.add('hidden');
            btnRefazer.classList.remove('hidden');
            btnBaixar.classList.remove('hidden');
        });

        // ============================================
        // BOTÃO: REFAZER FOTO
        // ============================================
        btnRefazer.addEventListener('click', () => {
            areaCamera.classList.remove('hidden');
            areaResultado.classList.add('hidden');
            btnTirarFoto.classList.remove('hidden');
            btnVirarCamera.classList.remove('hidden');
            btnRefazer.classList.add('hidden');
            btnBaixar.classList.add('hidden');
        });

        // ============================================
        // BOTÃO: BAIXAR FOTO
        // ============================================
        btnBaixar.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'cecilia-' + Date.now() + '.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });

        // Inicia
        iniciarCamera();
    </script>
</body>
</html>
