<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MolduraApp - Cecília 1 Aninho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        h1 {
            text-align: center;
            margin: 10px 0;
            font-size: 20px;
            color: #ff9ec7;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        video, #canvasResultado {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .moldura-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            object-fit: cover;
        }

        .botoes {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 400px;
        }

        button {
            background: #ff9ec7;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            flex: 1;
            min-width: 120px;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
            background: #ff7eb0;
        }

        .hidden {
            display: none !important;
        }

        #mensagem {
            padding: 10px;
            text-align: center;
            color: #ff9ec7;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>📸 Cecília - 1 Aninho</h1>
    <div id="mensagem">Carregando câmera...</div>

    <!-- Área da câmera ao vivo -->
    <div class="container" id="areaCamera">
        <video id="video" autoplay playsinline muted></video>
        <img id="molduraImg" class="moldura-overlay" alt="Moldura">
    </div>

    <!-- Área do resultado -->
    <div class="container hidden" id="areaResultado">
        <canvas id="canvasResultado"></canvas>
    </div>

    <!-- Botões -->
    <div class="botoes">
        <button id="btnTirarFoto">📷 Tirar Foto</button>
        <button id="btnVirarCamera">🔄 Virar Câmera</button>
        <button id="btnRefazer" class="hidden">↩️ Refazer</button>
        <button id="btnBaixar" class="hidden">⬇️ Baixar</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvasResultado');
        const ctx = canvas.getContext('2d');
        const molduraImg = document.getElementById('molduraImg');
        const areaCamera = document.getElementById('areaCamera');
        const areaResultado = document.getElementById('areaResultado');
        const btnTirarFoto = document.getElementById('btnTirarFoto');
        const btnVirarCamera = document.getElementById('btnVirarCamera');
        const btnRefazer = document.getElementById('btnRefazer');
        const btnBaixar = document.getElementById('btnBaixar');
        const mensagem = document.getElementById('mensagem');

        // Caminho da moldura - configurável
        const MOLDURA_URL = './molduras/cecilia.png';
        
        // Define a moldura
        molduraImg.src = MOLDURA_URL;
        
        // Objeto Image pra usar no canvas
        const moldura = new Image();
        moldura.crossOrigin = 'anonymous';
        moldura.src = MOLDURA_URL;

        // Variável pra alternar câmera
        let cameraAtual = 'environment'; // 'environment' = traseira, 'user' = frontal
        let streamAtual = null;

        // Inicia a câmera
        async function iniciarCamera() {
            try {
                mensagem.textContent = 'Iniciando câmera...';
                
                // Para o stream anterior se existir
                if (streamAtual) {
                    streamAtual.getTracks().forEach(track => track.stop());
                }

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: cameraAtual,
                        width: { ideal: 1080 },
                        height: { ideal: 1920 }
                    },
                    audio: false
                });
                
                streamAtual = stream;
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    mensagem.textContent = '';
                };
                
            } catch (err) {
                mensagem.textContent = '❌ Erro: ' + err.message;
                console.error(err);
                alert('Erro ao acessar a câmera: ' + err.message + '\n\nVerifique as permissões do navegador.');
            }
        }

        // Virar câmera (frontal/traseira)
        btnVirarCamera.addEventListener('click', () => {
            cameraAtual = cameraAtual === 'environment' ? 'user' : 'environment';
            iniciarCamera();
        });

        // Tira a foto
        btnTirarFoto.addEventListener('click', () => {
            if (!video.videoWidth) {
                alert('Câmera ainda não está pronta. Aguarde um momento.');
                return;
            }

            // Define o tamanho do canvas
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Se for câmera frontal, espelha a imagem
            if (cameraAtual === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            // Desenha o vídeo
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Reseta a transformação
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            // Desenha a moldura por cima
            if (moldura.complete && moldura.naturalWidth > 0) {
                ctx.drawImage(moldura, 0, 0, canvas.width, canvas.height);
            }

            // Alterna as áreas
            areaCamera.classList.add('hidden');
            areaResultado.classList.remove('hidden');
            btnTirarFoto.classList.add('hidden');
            btnVirarCamera.classList.add('hidden');
            btnRefazer.classList.remove('hidden');
            btnBaixar.classList.remove('hidden');
        });

        // Refazer a foto
        btnRefazer.addEventListener('click', () => {
            areaCamera.classList.remove('hidden');
            areaResultado.classList.add('hidden');
            btnTirarFoto.classList.remove('hidden');
            btnVirarCamera.classList.remove('hidden');
            btnRefazer.classList.add('hidden');
            btnBaixar.classList.add('hidden');
        });

        // Baixar a foto
        btnBaixar.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'foto-cecilia-' + Date.now() + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Inicia
        iniciarCamera();
    </script>
</body>
</html>>
