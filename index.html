<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MolduraApp - Cecília 1 Aninho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #ff9ec7;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
        }

        video, canvas, img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .moldura-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: #ff9ec7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff7eb0;
            transform: scale(1.05);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .hidden {
            display: none !important;
        }

        #canvasResultado {
            position: static;
            width: 100%;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <h1>📸 Cecília - 1 Aninho</h1>

    <!-- Área da câmera ao vivo -->
    <div class="container" id="areaCamera">
        <video id="video" autoplay playsinline></video>
        <img src="molduras/cecilia.png" class="moldura-overlay" alt="Moldura">
    </div>

    <!-- Área do resultado -->
    <div class="container hidden" id="areaResultado">
        <canvas id="canvasResultado"></canvas>
    </div>

    <!-- Botões -->
    <div class="botoes">
        <button id="btnTirarFoto">📷 Tirar Foto</button>
        <button id="btnRefazer" class="hidden">🔄 Refazer</button>
        <button id="btnBaixar" class="hidden">⬇️ Baixar Foto</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvasResultado');
        const ctx = canvas.getContext('2d');
        const areaCamera = document.getElementById('areaCamera');
        const areaResultado = document.getElementById('areaResultado');
        const btnTirarFoto = document.getElementById('btnTirarFoto');
        const btnRefazer = document.getElementById('btnRefazer');
        const btnBaixar = document.getElementById('btnBaixar');

        const moldura = new Image();
        moldura.src = 'molduras/cecilia.png';

        // Inicia a câmera
        async function iniciarCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' } // câmera traseira no celular
                });
                video.srcObject = stream;
            } catch (err) {
                alert('Erro ao acessar a câmera: ' + err.message);
                console.error(err);
            }
        }

        // Tira a foto
        btnTirarFoto.addEventListener('click', () => {
            // Define o tamanho do canvas igual ao vídeo
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Desenha o frame atual do vídeo no canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Desenha a moldura por cima
            ctx.drawImage(moldura, 0, 0, canvas.width, canvas.height);

            // Mostra o resultado, esconde a câmera
            areaCamera.classList.add('hidden');
            areaResultado.classList.remove('hidden');
            btnTirarFoto.classList.add('hidden');
            btnRefazer.classList.remove('hidden');
            btnBaixar.classList.remove('hidden');
        });

        // Refazer a foto
        btnRefazer.addEventListener('click', () => {
            areaCamera.classList.remove('hidden');
            areaResultado.classList.add('hidden');
            btnTirarFoto.classList.remove('hidden');
            btnRefazer.classList.add('hidden');
            btnBaixar.classList.add('hidden');
        });

        // Baixar a foto
        btnBaixar.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'foto-cecilia-' + Date.now() + '.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Inicia tudo
        iniciarCamera();
    </script>
</body>
</html>
