<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MolduraApp - Cecília 1 Aninho</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        h1 {
            text-align: center;
            margin: 8px 0;
            font-size: 18px;
            color: #ff9ec7;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            flex: 1;
            max-height: calc(100vh - 140px);
            aspect-ratio: 9 / 16;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        video, #canvasResultado {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Espelha o vídeo quando a câmera é frontal (efeito espelho) */
        video.espelhado {
            transform: scaleX(-1);
        }

        .moldura-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            object-fit: cover;
        }

        .botoes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 400px;
            padding: 5px 0;
        }

        button {
            background: #ff9ec7;
            color: white;
            border: none;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            flex: 1;
            min-width: 100px;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
            background: #ff7eb0;
        }

        .hidden {
            display: none !important;
        }

        #mensagem {
            padding: 5px;
            text-align: center;
            color: #ff9ec7;
            font-size: 12px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <h1>📸 Cecília - 1 Aninho</h1>
    <div id="mensagem">Iniciando...</div>

    <div class="container" id="areaCamera">
        <video id="video" autoplay playsinline muted></video>
        <img id="molduraImg" class="moldura-overlay" src="./Molduras/cecilia.png" alt="Moldura">
    </div>

    <div class="container hidden" id="areaResultado">
        <canvas id="canvasResultado"></canvas>
    </div>

    <div class="botoes">
        <button id="btnTirarFoto">📷 Tirar Foto</button>
        <button id="btnVirarCamera">🔄 Virar</button>
        <button id="btnRefazer" class="hidden">↩️ Refazer</button>
        <button id="btnBaixar" class="hidden">⬇️ Baixar</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvasResultado');
        const ctx = canvas.getContext('2d');
        const molduraImg = document.getElementById('molduraImg');
        const areaCamera = document.getElementById('areaCamera');
        const areaResultado = document.getElementById('areaResultado');
        const btnTirarFoto = document.getElementById('btnTirarFoto');
        const btnVirarCamera = document.getElementById('btnVirarCamera');
        const btnRefazer = document.getElementById('btnRefazer');
        const btnBaixar = document.getElementById('btnBaixar');
        const mensagem = document.getElementById('mensagem');

        // Carrega a moldura em alta resolução
        const moldura = new Image();
        moldura.src = './Molduras/cecilia.png';
        
        moldura.onload = () => {
            mensagem.textContent = '✅ Pronto!';
            setTimeout(() => { mensagem.textContent = ''; }, 1500);
        };
        
        moldura.onerror = () => {
            mensagem.textContent = '⚠️ Moldura não encontrada';
        };

        let cameraAtual = 'environment';
        let streamAtual = null;

        async function iniciarCamera() {
            try {
                mensagem.textContent = 'Iniciando câmera...';
                
                if (streamAtual) {
                    streamAtual.getTracks().forEach(track => track.stop());
                    streamAtual = null;
                }

                // Pede a MAIOR resolução possível (ideal), mas sem forçar
                // O "ideal" faz o navegador escolher a melhor resolução disponível
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: cameraAtual,
                        width: { ideal: 1920 },
                        height: { ideal: 1920 },
                        aspectRatio: { ideal: 9/16 }
                    },
                    audio: false
                });
                
                streamAtual = stream;
                video.srcObject = stream;
                
                // Aplica efeito espelho SÓ no preview da câmera frontal
                if (cameraAtual === 'user') {
                    video.classList.add('espelhado');
                } else {
                    video.classList.remove('espelhado');
                }
                
                video.onloadedmetadata = () => {
                    video.play();
                    mensagem.textContent = '';
                    // Debug - mostra resolução real (você pode remover depois)
                    console.log('Resolução câmera:', video.videoWidth, 'x', video.videoHeight);
                };
                
            } catch (err) {
                mensagem.textContent = '❌ Erro: ' + err.message;
                console.error(err);
            }
        }

        btnVirarCamera.addEventListener('click', () => {
            cameraAtual = cameraAtual === 'environment' ? 'user' : 'environment';
            iniciarCamera();
        });

        btnTirarFoto.addEventListener('click', () => {
            if (!video.videoWidth) {
                alert('Câmera ainda não está pronta. Aguarde 1 segundo.');
                return;
            }

            // Usa a resolução real do vídeo (máxima qualidade)
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // A foto salva NÃO fica espelhada (padrão profissional, tipo Instagram)
            // O preview mostra espelhado (parece espelho), mas a foto sai normal
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Desenha a moldura por cima em alta qualidade
            if (moldura.complete && moldura.naturalWidth > 0) {
                ctx.drawImage(moldura, 0, 0, canvas.width, canvas.height);
            }

            areaCamera.classList.add('hidden');
            areaResultado.classList.remove('hidden');
            btnTirarFoto.classList.add('hidden');
            btnVirarCamera.classList.add('hidden');
            btnRefazer.classList.remove('hidden');
            btnBaixar.classList.remove('hidden');
        });

        btnRefazer.addEventListener('click', () => {
            areaCamera.classList.remove('hidden');
            areaResultado.classList.add('hidden');
            btnTirarFoto.classList.remove('hidden');
            btnVirarCamera.classList.remove('hidden');
            btnRefazer.classList.add('hidden');
            btnBaixar.classList.add('hidden');
        });

        btnBaixar.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'foto-cecilia-' + Date.now() + '.jpg';
            // JPG com qualidade máxima (0.95 = 95% qualidade, arquivo menor que PNG)
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });

        iniciarCamera();
    </script>
</body>
</html>
