<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Eternize esse momento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }

        h1 {
            text-align: center;
            margin: 8px 0;
            font-size: 20px;
            color: #ff9ec7;
        }

        .subtitulo {
            text-align: center;
            color: #ff9ec7;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .tela-escolha {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex: 1;
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .btn-escolha {
            width: 100%;
            padding: 30px 20px;
            background: linear-gradient(135deg, #ff9ec7, #ff7eb0);
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .btn-escolha:active { transform: scale(0.97); }
        .btn-escolha .icone { font-size: 40px; }
        .btn-escolha .descricao {
            font-size: 12px;
            font-weight: normal;
            opacity: 0.9;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 2000 / 2666;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #video {
            position: absolute;
            top: 3.26%;
            left: 10%;
            width: 80%;
            height: 72.62%;
            object-fit: cover;
            display: block;
        }

        video.espelhado { transform: scaleX(-1); }

        #canvasResultado {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .area-ajuste {
            position: absolute;
            top: 3.26%;
            left: 10%;
            width: 80%;
            height: 72.62%;
            overflow: hidden;
            background: #333;
            touch-action: none;
            cursor: grab;
        }

        .area-ajuste:active { cursor: grabbing; }

        #fotoAjuste {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            will-change: transform;
            pointer-events: none;
            max-width: none;
            max-height: none;
        }

        .moldura-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .botoes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 400px;
            padding: 5px 0;
        }

        button {
            background: #ff9ec7;
            color: white;
            border: none;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            flex: 1;
            min-width: 100px;
            transition: 0.2s;
        }

        button:active {
            transform: scale(0.95);
            background: #ff7eb0;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-voltar { background: #444; flex: 0 0 auto; min-width: 80px; }
        .btn-reset { background: #666; flex: 0 0 auto; min-width: 80px; }
        .btn-confirmar { background: #4CAF50; }
        .btn-confirmar:active { background: #45a049; }
        .btn-compartilhar { background: #25D366; }
        .btn-compartilhar:active { background: #1DA851; }

        /* BOTÃO DESTAQUE - ENVIAR PRA IMPRESSÃO */
        .btn-enviar-impressao {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            width: 100%;
            padding: 16px;
            font-size: 16px;
            flex: 1 1 100%;
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }

        .btn-enviar-impressao:active {
            background: linear-gradient(135deg, #1976D2, #1565C0);
        }

        .hidden { display: none !important; }

        #mensagem {
            padding: 5px;
            text-align: center;
            color: #ff9ec7;
            font-size: 12px;
            min-height: 20px;
        }

        #inputFoto { display: none; }

        .dica-ajuste {
            text-align: center;
            color: #888;
            font-size: 11px;
            margin-top: 5px;
        }

        /* MODAL DE ENVIO / SUCESSO */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-conteudo {
            background: white;
            color: #333;
            padding: 30px 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            width: 100%;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-icone {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .modal-titulo {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .modal-texto {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal button {
            background: #ff9ec7;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            width: auto;
        }

        .loading {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2196F3;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>✨ Eternize esse momento</h1>

    <div class="tela-escolha" id="telaEscolha">
        <div class="subtitulo">Como quer criar sua foto?</div>
        
        <button class="btn-escolha" id="btnAbrirCamera">
            <span class="icone">📷</span>
            <span>TIRAR FOTO</span>
            <span class="descricao">Usar câmera do celular</span>
        </button>

        <button class="btn-escolha" id="btnAbrirGaleria">
            <span class="icone">🖼️</span>
            <span>ENVIAR FOTO</span>
            <span class="descricao">Escolher da galeria</span>
        </button>

        <input type="file" id="inputFoto" accept="image/*">
    </div>

    <div class="container hidden" id="areaCamera">
        <video id="video" autoplay playsinline muted></video>
        <img class="moldura-overlay" src="./Molduras/moldura.png" alt="Moldura">
    </div>

    <div class="container hidden" id="areaAjuste">
        <div class="area-ajuste" id="areaFoto">
            <img id="fotoAjuste" alt="Sua foto">
        </div>
        <img class="moldura-overlay" src="./Molduras/moldura.png" alt="Moldura">
    </div>

    <div class="container hidden" id="areaResultado">
        <canvas id="canvasResultado"></canvas>
    </div>

    <div id="mensagem"></div>

    <div class="botoes hidden" id="botoesCamera">
        <button class="btn-voltar" id="btnVoltarCamera">← Voltar</button>
        <button id="btnTirarFoto">📷 Tirar Foto</button>
        <button id="btnVirarCamera">🔄 Virar</button>
    </div>

    <div class="botoes hidden" id="botoesAjuste">
        <button class="btn-voltar" id="btnVoltarAjuste">← Voltar</button>
        <button class="btn-reset" id="btnResetAjuste">🔄 Resetar</button>
        <button class="btn-confirmar" id="btnConfirmarAjuste">✅ Confirmar</button>
    </div>
    <div class="dica-ajuste hidden" id="dicaAjuste">
        👆 Arraste • 🤏 2 dedos pra zoom
    </div>

    <div class="botoes hidden" id="botoesResultado">
        <button class="btn-voltar" id="btnRefazer">↩️ Refazer</button>
        <button id="btnBaixar">⬇️ Baixar</button>
        <button class="btn-compartilhar" id="btnCompartilhar">📤 Compartilhar</button>
        <button class="btn-enviar-impressao" id="btnEnviarImpressao">📮 Enviar pra Impressão</button>
    </div>

    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // ============================================
        // CONFIGURAÇÃO DO SUPABASE
        // ============================================
        const SUPABASE_URL = "https://scwznirvzwrphztvopbz.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjd3puaXJ2endycGh6dHZvcGJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzI2NzQsImV4cCI6MjA5NTY0ODY3NH0.PLvr547bIEJwjECKxQaoR7lpazs8GbSpLYLMDiGD4Po";
        const BUCKET_FOTOS = "fotos-eventos";
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============================================
        // CONFIGURAÇÕES DA MOLDURA
        // ============================================
        const MOLDURA = {
            larguraTotal: 2000,
            alturaTotal: 2666,
            janelaX: 200,
            janelaY: 87,
            janelaLargura: 1600,
            janelaAltura: 1936,
            arquivo: './Molduras/moldura.png'
        };

        // ELEMENTOS
        const telaEscolha = document.getElementById('telaEscolha');
        const areaCamera = document.getElementById('areaCamera');
        const areaAjuste = document.getElementById('areaAjuste');
        const areaResultado = document.getElementById('areaResultado');
        const botoesCamera = document.getElementById('botoesCamera');
        const botoesAjuste = document.getElementById('botoesAjuste');
        const botoesResultado = document.getElementById('botoesResultado');
        const dicaAjuste = document.getElementById('dicaAjuste');
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvasResultado');
        const ctx = canvas.getContext('2d');
        const areaFoto = document.getElementById('areaFoto');
        const fotoAjuste = document.getElementById('fotoAjuste');
        
        const btnAbrirCamera = document.getElementById('btnAbrirCamera');
        const btnAbrirGaleria = document.getElementById('btnAbrirGaleria');
        const btnVoltarCamera = document.getElementById('btnVoltarCamera');
        const btnTirarFoto = document.getElementById('btnTirarFoto');
        const btnVirarCamera = document.getElementById('btnVirarCamera');
        const btnVoltarAjuste = document.getElementById('btnVoltarAjuste');
        const btnResetAjuste = document.getElementById('btnResetAjuste');
        const btnConfirmarAjuste = document.getElementById('btnConfirmarAjuste');
        const btnRefazer = document.getElementById('btnRefazer');
        const btnBaixar = document.getElementById('btnBaixar');
        const btnCompartilhar = document.getElementById('btnCompartilhar');
        const btnEnviarImpressao = document.getElementById('btnEnviarImpressao');
        const inputFoto = document.getElementById('inputFoto');
        const mensagem = document.getElementById('mensagem');

        const moldura = new Image();
        moldura.src = MOLDURA.arquivo;

        let cameraAtual = 'environment';
        let streamAtual = null;
        let imagemOriginal = null;
        let fotoJaEnviada = false; // controla se essa foto já foi enviada
        
        let ajuste = { x: 0, y: 0, scale: 1, initialScale: 1 };

        // NAVEGAÇÃO
        function mostrarTela(tela) {
            telaEscolha.classList.add('hidden');
            areaCamera.classList.add('hidden');
            areaAjuste.classList.add('hidden');
            areaResultado.classList.add('hidden');
            botoesCamera.classList.add('hidden');
            botoesAjuste.classList.add('hidden');
            botoesResultado.classList.add('hidden');
            dicaAjuste.classList.add('hidden');

            if (tela === 'escolha') {
                telaEscolha.classList.remove('hidden');
                pararCamera();
                fotoJaEnviada = false; // reseta ao voltar pra escolha
            } else if (tela === 'camera') {
                areaCamera.classList.remove('hidden');
                botoesCamera.classList.remove('hidden');
            } else if (tela === 'ajuste') {
                areaAjuste.classList.remove('hidden');
                botoesAjuste.classList.remove('hidden');
                dicaAjuste.classList.remove('hidden');
                pararCamera();
            } else if (tela === 'resultado') {
                areaResultado.classList.remove('hidden');
                botoesResultado.classList.remove('hidden');
                pararCamera();
                // Reseta botão de enviar
                btnEnviarImpressao.disabled = false;
                btnEnviarImpressao.textContent = '📮 Enviar pra Impressão';
                btnEnviarImpressao.style.display = fotoJaEnviada ? 'none' : 'block';
            }
        }

        // CÂMERA
        btnAbrirCamera.addEventListener('click', () => {
            mostrarTela('camera');
            iniciarCamera();
        });

        // GALERIA
        btnAbrirGaleria.addEventListener('click', () => {
            inputFoto.click();
        });

        inputFoto.addEventListener('change', (e) => {
            const arquivo = e.target.files[0];
            if (!arquivo) return;

            mensagem.textContent = 'Carregando foto...';
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    imagemOriginal = img;
                    mostrarTela('ajuste');
                    setTimeout(() => {
                        iniciarAjuste();
                        mensagem.textContent = '';
                    }, 100);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(arquivo);
        });

        function iniciarAjuste() {
            fotoAjuste.src = imagemOriginal.src;
            fotoAjuste.style.width = imagemOriginal.width + 'px';
            fotoAjuste.style.height = imagemOriginal.height + 'px';

            const rectArea = areaFoto.getBoundingClientRect();
            
            if (rectArea.width === 0 || rectArea.height === 0) {
                setTimeout(iniciarAjuste, 100);
                return;
            }

            const scaleX = rectArea.width / imagemOriginal.width;
            const scaleY = rectArea.height / imagemOriginal.height;
            const scaleCover = Math.max(scaleX, scaleY);

            ajuste.scale = scaleCover;
            ajuste.initialScale = scaleCover;
            ajuste.x = (rectArea.width - imagemOriginal.width * scaleCover) / 2;
            ajuste.y = (rectArea.height - imagemOriginal.height * scaleCover) / 2;

            aplicarTransform();
        }

        function aplicarTransform() {
            fotoAjuste.style.transform = 
                `translate(${ajuste.x}px, ${ajuste.y}px) scale(${ajuste.scale})`;
        }

        // GESTOS
        let toqueInicial = null;
        let distanciaInicial = 0;
        let scaleInicial = 1;
        let ajusteInicial = { x: 0, y: 0 };

        function getDistancia(t) {
            const dx = t[0].clientX - t[1].clientX;
            const dy = t[0].clientY - t[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function getCentro(t) {
            return {
                x: (t[0].clientX + t[1].clientX) / 2,
                y: (t[0].clientY + t[1].clientY) / 2
            };
        }

        areaFoto.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length === 1) {
                toqueInicial = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                ajusteInicial = { x: ajuste.x, y: ajuste.y };
            } else if (e.touches.length === 2) {
                distanciaInicial = getDistancia(e.touches);
                scaleInicial = ajuste.scale;
                toqueInicial = getCentro(e.touches);
                ajusteInicial = { x: ajuste.x, y: ajuste.y };
            }
        }, { passive: false });

        areaFoto.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 1 && toqueInicial) {
                const dx = e.touches[0].clientX - toqueInicial.x;
                const dy = e.touches[0].clientY - toqueInicial.y;
                ajuste.x = ajusteInicial.x + dx;
                ajuste.y = ajusteInicial.y + dy;
                aplicarTransform();
            } else if (e.touches.length === 2 && distanciaInicial > 0) {
                const novaDistancia = getDistancia(e.touches);
                const escalaFator = novaDistancia / distanciaInicial;
                const novoScale = Math.max(
                    ajuste.initialScale * 0.5,
                    Math.min(scaleInicial * escalaFator, ajuste.initialScale * 5)
                );
                
                const centroAtual = getCentro(e.touches);
                const rectArea = areaFoto.getBoundingClientRect();
                const cx = centroAtual.x - rectArea.left;
                const cy = centroAtual.y - rectArea.top;
                
                const scaleDiff = novoScale / scaleInicial;
                ajuste.x = cx - (cx - ajusteInicial.x) * scaleDiff;
                ajuste.y = cy - (cy - ajusteInicial.y) * scaleDiff;
                ajuste.scale = novoScale;
                
                aplicarTransform();
            }
        }, { passive: false });

        areaFoto.addEventListener('touchend', (e) => {
            if (e.touches.length === 0) {
                toqueInicial = null;
                distanciaInicial = 0;
            }
        });

        // Mouse
        let mouseDown = false;
        areaFoto.addEventListener('mousedown', (e) => {
            mouseDown = true;
            toqueInicial = { x: e.clientX, y: e.clientY };
            ajusteInicial = { x: ajuste.x, y: ajuste.y };
        });
        areaFoto.addEventListener('mousemove', (e) => {
            if (!mouseDown) return;
            const dx = e.clientX - toqueInicial.x;
            const dy = e.clientY - toqueInicial.y;
            ajuste.x = ajusteInicial.x + dx;
            ajuste.y = ajusteInicial.y + dy;
            aplicarTransform();
        });
        areaFoto.addEventListener('mouseup', () => { mouseDown = false; });
        areaFoto.addEventListener('mouseleave', () => { mouseDown = false; });
        areaFoto.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const novoScale = Math.max(
                ajuste.initialScale * 0.5,
                Math.min(ajuste.scale * delta, ajuste.initialScale * 5)
            );
            const rectArea = areaFoto.getBoundingClientRect();
            const cx = e.clientX - rectArea.left;
            const cy = e.clientY - rectArea.top;
            const scaleDiff = novoScale / ajuste.scale;
            ajuste.x = cx - (cx - ajuste.x) * scaleDiff;
            ajuste.y = cy - (cy - ajuste.y) * scaleDiff;
            ajuste.scale = novoScale;
            aplicarTransform();
        }, { passive: false });

        // BOTÕES AJUSTE
        btnVoltarAjuste.addEventListener('click', () => {
            inputFoto.value = '';
            mostrarTela('escolha');
        });

        btnResetAjuste.addEventListener('click', iniciarAjuste);

        btnConfirmarAjuste.addEventListener('click', () => {
            canvas.width = MOLDURA.larguraTotal;
            canvas.height = MOLDURA.alturaTotal;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const rectArea = areaFoto.getBoundingClientRect();
            const propL = MOLDURA.janelaLargura / rectArea.width;
            const propA = MOLDURA.janelaAltura / rectArea.height;

            ctx.save();
            ctx.beginPath();
            ctx.rect(MOLDURA.janelaX, MOLDURA.janelaY, MOLDURA.janelaLargura, MOLDURA.janelaAltura);
            ctx.clip();
            ctx.translate(MOLDURA.janelaX, MOLDURA.janelaY);
            ctx.translate(ajuste.x * propL, ajuste.y * propA);
            ctx.scale(ajuste.scale * propL, ajuste.scale * propA);
            ctx.drawImage(imagemOriginal, 0, 0);
            ctx.restore();

            if (moldura.complete && moldura.naturalWidth > 0) {
                ctx.drawImage(moldura, 0, 0, MOLDURA.larguraTotal, MOLDURA.alturaTotal);
            }
            fotoJaEnviada = false;
            mostrarTela('resultado');
        });

        // CÂMERA
        async function iniciarCamera() {
            try {
                mensagem.textContent = 'Iniciando câmera...';
                if (streamAtual) {
                    streamAtual.getTracks().forEach(t => t.stop());
                    streamAtual = null;
                }
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: cameraAtual,
                        width: { ideal: 1920 },
                        height: { ideal: 2322 }
                    },
                    audio: false
                });
                streamAtual = stream;
                video.srcObject = stream;
                if (cameraAtual === 'user') video.classList.add('espelhado');
                else video.classList.remove('espelhado');
                video.onloadedmetadata = () => {
                    video.play();
                    mensagem.textContent = '';
                };
            } catch (err) {
                mensagem.textContent = '❌ Erro: ' + err.message;
            }
        }

        function pararCamera() {
            if (streamAtual) {
                streamAtual.getTracks().forEach(t => t.stop());
                streamAtual = null;
            }
        }

        btnVoltarCamera.addEventListener('click', () => mostrarTela('escolha'));
        btnVirarCamera.addEventListener('click', () => {
            cameraAtual = cameraAtual === 'environment' ? 'user' : 'environment';
            iniciarCamera();
        });

        btnTirarFoto.addEventListener('click', () => {
            if (!video.videoWidth) {
                alert('Câmera ainda não está pronta.');
                return;
            }
            canvas.width = MOLDURA.larguraTotal;
            canvas.height = MOLDURA.alturaTotal;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const propJ = MOLDURA.janelaLargura / MOLDURA.janelaAltura;
            const propC = video.videoWidth / video.videoHeight;
            let sx, sy, sW, sH;

            if (propC > propJ) {
                sH = video.videoHeight;
                sW = video.videoHeight * propJ;
                sx = (video.videoWidth - sW) / 2;
                sy = 0;
            } else {
                sW = video.videoWidth;
                sH = video.videoWidth / propJ;
                sx = 0;
                sy = (video.videoHeight - sH) / 2;
            }

            ctx.drawImage(video, sx, sy, sW, sH,
                MOLDURA.janelaX, MOLDURA.janelaY,
                MOLDURA.janelaLargura, MOLDURA.janelaAltura);

            if (moldura.complete && moldura.naturalWidth > 0) {
                ctx.drawImage(moldura, 0, 0, MOLDURA.larguraTotal, MOLDURA.alturaTotal);
            }
            fotoJaEnviada = false;
            mostrarTela('resultado');
        });

        // RESULTADO - REFAZER
        btnRefazer.addEventListener('click', () => {
            inputFoto.value = '';
            mostrarTela('escolha');
        });

        // RESULTADO - BAIXAR
        btnBaixar.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'foto-' + Date.now() + '.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });

        // RESULTADO - COMPARTILHAR
        btnCompartilhar.addEventListener('click', async () => {
            try {
                canvas.toBlob(async (blob) => {
                    const arquivo = new File(
                        [blob], 
                        'foto-' + Date.now() + '.jpg',
                        { type: 'image/jpeg' }
                    );

                    if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
                        await navigator.share({
                            files: [arquivo],
                            title: 'Momento especial',
                            text: '✨ Eternize esse momento'
                        });
                    } else {
                        alert('Seu navegador não suporta compartilhamento direto. Vamos baixar a foto pra você compartilhar manualmente.');
                        btnBaixar.click();
                    }
                }, 'image/jpeg', 0.95);
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error(err);
                    alert('Não foi possível compartilhar. Tente baixar a foto.');
                }
            }
        });

        // ============================================
        // ⭐ NOVO: ENVIAR PRA IMPRESSÃO (SUPABASE)
        // ============================================
        btnEnviarImpressao.addEventListener('click', async () => {
            if (fotoJaEnviada) {
                mostrarModal('info', '⚠️', 'Foto já enviada', 'Essa foto já foi enviada pra impressão!');
                return;
            }

            btnEnviarImpressao.disabled = true;
            btnEnviarImpressao.textContent = '⏳ Enviando...';

            try {
                // Converte canvas em blob
                const blob = await new Promise((resolve) => {
                    canvas.toBlob(resolve, 'image/jpeg', 0.95);
                });

                if (!blob) {
                    throw new Error('Erro ao gerar foto');
                }

                // Nome único do arquivo
                const timestamp = Date.now();
                const random = Math.random().toString(36).substring(2, 8);
                const nomeArquivo = `foto-${timestamp}-${random}.jpg`;

                // Upload pro Supabase
                const { error } = await supabaseClient
                    .storage
                    .from(BUCKET_FOTOS)
                    .upload(nomeArquivo, blob, {
                        cacheControl: '3600',
                        upsert: false,
                        contentType: 'image/jpeg'
                    });

                if (error) throw error;

                // Sucesso!
                fotoJaEnviada = true;
                btnEnviarImpressao.style.display = 'none';
                
                mostrarModal(
                    'sucesso',
                    '🎉',
                    'Foto enviada!',
                    'Sua foto será impressa e entregue durante a festa! 💖<br><br>Você também pode baixar ou compartilhar essa foto agora.'
                );

            } catch (err) {
                console.error('Erro upload:', err);
                btnEnviarImpressao.disabled = false;
                btnEnviarImpressao.textContent = '📮 Enviar pra Impressão';
                
                mostrarModal(
                    'erro',
                    '❌',
                    'Ops! Algo deu errado',
                    'Não foi possível enviar a foto. Verifique sua internet e tente novamente.<br><br><small>Erro: ' + err.message + '</small>'
                );
            }
        });

        // ============================================
        // MODAL
        // ============================================
        function mostrarModal(tipo, icone, titulo, texto) {
            const modalExistente = document.querySelector('.modal');
            if (modalExistente) modalExistente.remove();

            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-conteudo">
                    <div class="modal-icone">${icone}</div>
                    <div class="modal-titulo">${titulo}</div>
                    <div class="modal-texto">${texto}</div>
                    <button onclick="this.closest('.modal').remove()">OK</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        mostrarTela('escolha');
    </script>
</body>
</html>
