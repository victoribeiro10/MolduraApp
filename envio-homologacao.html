<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EntreClicks · Envio de fotos (Teste)</title><style>*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:#111820;color:#f8f4eb;min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}main{width:min(100%,440px);border:1px solid #55504a;background:#202831;border-radius:18px;padding:30px}h1{margin:0 0 5px}.sub{color:#d6b47c;font-size:12px;letter-spacing:1px}p{line-height:1.5;color:#d4d8dc}input{width:100%;padding:15px;background:#121921;border:1px solid #65707c;border-radius:9px;color:white}button{background:#d6b47c;color:#1b1b1b;border:0;border-radius:9px;padding:14px;width:100%;font-weight:700;margin-top:18px}button:disabled{opacity:.55}#previa{display:none;width:100%;max-height:440px;object-fit:contain;margin-top:15px;border:1px solid #d6b47c;border-radius:8px;background:#121921}#notaMoldura{font-size:12px;color:#d6b47c;margin:12px 0 0}#status{min-height:30px;font-size:14px}small{color:#aeb8c1}</style></head><body><main><h1>EntreClicks</h1><div class="sub">ENVIO DE FOTOS · HOMOLOGAÇÃO</div><h2 id="nome">Verificando evento...</h2><p id="descricao">Aguarde enquanto confirmamos o convite.</p><form id="envio" hidden><input id="foto" type="file" accept="image/jpeg,image/png,image/webp" required><p id="notaMoldura"></p><img id="previa" alt="Prévia da foto com moldura demonstrativa"><button id="botao">Enviar foto</button></form><p id="status" role="status" aria-live="polite"></p><small>Ambiente de testes. Não envie fotos pessoais ou de clientes.</small></main><script>
const endpoint="https://aukbkykkoeovouflijlz.supabase.co/functions/v1/receber-foto-homologacao";
const token=new URLSearchParams(location.search).get("token")||"";
let eventoNome="",molduraDemo=false,arquivoPronto=null;
const inputFoto=document.getElementById("foto"),previa=document.getElementById("previa"),notaMoldura=document.getElementById("notaMoldura");
const nome=document.getElementById("nome"),desc=document.getElementById("descricao"),form=document.getElementById("envio"),status=document.getElementById("status"),botao=document.getElementById("botao");
async function verificar(){try{const r=await fetch(endpoint+"?token="+encodeURIComponent(token),{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Convite inválido");nome.textContent=d.nome;eventoNome=d.nome||"Evento EntreClicks";molduraDemo=token==="94fc043f-d0c6-4cd1-84f8-90639558d51f";notaMoldura.textContent=molduraDemo?"Teste 10: a foto será enviada com moldura demonstrativa aplicada.":"Envio normal sem moldura demonstrativa.";desc.textContent=d.recebendo_fotos&&d.status!=="encerrado"?"Escolha uma imagem de teste para enviar.":"Recebimento pausado para este evento.";form.hidden=!(d.recebendo_fotos&&d.status!=="encerrado")}catch(e){nome.textContent="Convite indisponível";desc.textContent=e.message}}
async function prepararFoto(file){
 const bitmap=await createImageBitmap(file);
 try{
   const canvas=document.createElement("canvas");canvas.width=1560;canvas.height=2140;
   const ctx=canvas.getContext("2d",{alpha:false});if(!ctx)throw Error("Seu navegador não suporta o editor de fotos.");
   ctx.fillStyle="#faf8f3";ctx.fillRect(0,0,1560,2140);
   const area={x:95,y:100,w:1370,h:1810};
   const escala=Math.max(area.w/bitmap.width,area.h/bitmap.height);
   const largura=bitmap.width*escala,altura=bitmap.height*escala;
   ctx.save();ctx.beginPath();ctx.rect(area.x,area.y,area.w,area.h);ctx.clip();
   ctx.drawImage(bitmap,area.x+(area.w-largura)/2,area.y+(area.h-altura)/2,largura,altura);ctx.restore();
   ctx.strokeStyle="#b99a62";ctx.lineWidth=13;ctx.strokeRect(65,70,1430,1880);
   ctx.strokeStyle="#e1d1b3";ctx.lineWidth=4;ctx.strokeRect(83,88,1394,1844);
   ctx.fillStyle="#b99a62";ctx.fillRect(0,1960,1560,4);
   ctx.textAlign="center";ctx.fillStyle="#5b4a34";ctx.font="bold 43px Georgia,serif";
   const titulo=eventoNome.length>40?eventoNome.slice(0,37)+"...":eventoNome;
   ctx.fillText(titulo,780,2035,1430);
   ctx.font="24px Arial,sans-serif";ctx.fillStyle="#a28a65";ctx.fillText("ENTRECLICKS · MOLDURA DE TESTE",780,2090,1430);
   const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",.93));
   if(!blob)throw Error("Não foi possível gerar a foto emoldurada.");
   return new File([blob],"entreclicks-emoldurada.jpg",{type:"image/jpeg"});
 }finally{bitmap.close?.()}
}
inputFoto.addEventListener("change",async()=>{
 arquivoPronto=null;previa.style.display="none";
 const file=inputFoto.files?.[0];if(!file)return;
 if(!molduraDemo){status.textContent="Foto original selecionada.";return}
 if(file.size>8*1024*1024){status.textContent="Máximo de 8 MB.";return}
 botao.disabled=true;status.textContent="Preparando prévia com moldura...";
 try{
   arquivoPronto=await prepararFoto(file);
   previa.src=URL.createObjectURL(arquivoPronto);
   previa.style.display="block";
   status.textContent="Prévia pronta. Confira o enquadramento antes de enviar.";
 }catch(err){status.textContent=err.message}
 finally{botao.disabled=false}
});
form.addEventListener("submit",async e=>{e.preventDefault();const original=inputFoto.files[0];if(!original)return;if(molduraDemo&&!arquivoPronto){status.textContent="Aguarde a prévia da moldura ficar pronta.";return}const f=molduraDemo?arquivoPronto:original;if(f.size>8*1024*1024){status.textContent="Máximo de 8 MB.";return}botao.disabled=true;status.textContent="Enviando...";try{const body=new FormData();body.append("foto",f);const r=await fetch(endpoint,{method:"POST",headers:{"x-event-token":token},body});const d=await r.json();if(!r.ok)throw Error(d.error||"Falha no envio");status.textContent="Foto recebida com sucesso!";form.reset();arquivoPronto=null;previa.style.display="none"}catch(err){status.textContent=err.message}finally{botao.disabled=false;await verificar()}});
verificar();
</script></body></html>
