<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EntreClicks · Envio de fotos (Teste)</title><style>*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:#111820;color:#f8f4eb;min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}main{width:min(100%,440px);border:1px solid #55504a;background:#202831;border-radius:18px;padding:30px}h1{margin:0 0 5px}.sub{color:#d6b47c;font-size:12px;letter-spacing:1px}p{line-height:1.5;color:#d4d8dc}input{width:100%;padding:15px;background:#121921;border:1px solid #65707c;border-radius:9px;color:white}button{background:#d6b47c;color:#1b1b1b;border:0;border-radius:9px;padding:14px;width:100%;font-weight:700;margin-top:18px}button:disabled{opacity:.55}#previa{display:none;width:100%;max-height:440px;object-fit:contain;margin-top:15px;border:1px solid #d6b47c;border-radius:8px;background:#121921}#notaMoldura{font-size:12px;color:#d6b47c;margin:12px 0 0}#status{min-height:30px;font-size:14px}small{color:#aeb8c1}</style></head><body><main><h1>EntreClicks</h1><div class="sub">ENVIO DE FOTOS · HOMOLOGAÇÃO</div><h2 id="nome">Verificando evento...</h2><p id="descricao">Aguarde enquanto confirmamos o convite.</p><form id="envio" hidden><input id="foto" type="file" accept="image/jpeg,image/png,image/webp" required><p id="notaMoldura"></p><img id="previa" alt="Prévia da foto com moldura demonstrativa"><button id="botao">Enviar foto</button></form><p id="status" role="status" aria-live="polite"></p><small>Ambiente de testes. Não envie fotos pessoais ou de clientes.</small></main><script>
const endpoint="https://aukbkykkoeovouflijlz.supabase.co/functions/v1/receber-foto-homologacao";
const token=new URLSearchParams(location.search).get("token")||"";
let eventoNome="",configMoldura=null,arquivoPronto=null;
const inputFoto=document.getElementById("foto"),previa=document.getElementById("previa"),notaMoldura=document.getElementById("notaMoldura");
const nome=document.getElementById("nome"),desc=document.getElementById("descricao"),form=document.getElementById("envio"),status=document.getElementById("status"),botao=document.getElementById("botao");
async function verificar(){try{const r=await fetch(endpoint+"?token="+encodeURIComponent(token),{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Convite inválido");nome.textContent=d.nome;eventoNome=d.nome||"Evento EntreClicks";configMoldura=d.moldura_url&&d.janela_largura>0&&d.janela_altura>0?d:null;notaMoldura.textContent=configMoldura?"Moldura oficial configurada para este evento. Confira a prévia.":"Este evento ainda não possui moldura configurada; o envio de teste permanece sem moldura.";desc.textContent=d.recebendo_fotos&&d.status!=="encerrado"?"Escolha uma imagem de teste para enviar.":"Recebimento pausado para este evento.";form.hidden=!(d.recebendo_fotos&&d.status!=="encerrado")}catch(e){nome.textContent="Convite indisponível";desc.textContent=e.message+" · Verifique a conexão ou tente novamente.";}}
async function prepararFoto(file){
 const cfg=configMoldura;if(!cfg)return file;
 const [bitmap,moldura]=await Promise.all([createImageBitmap(file),new Promise((resolve,reject)=>{const img=new Image();img.crossOrigin="anonymous";img.onload=()=>resolve(img);img.onerror=()=>reject(Error("Não foi possível carregar a moldura deste evento."));img.src=cfg.moldura_url})]);
 try{
  const w=moldura.naturalWidth,h=moldura.naturalHeight,x=cfg.janela_x,y=cfg.janela_y,aw=cfg.janela_largura,ah=cfg.janela_altura;
  if(!w||!h||x<0||y<0||x+aw>w||y+ah>h)throw Error("Janela da moldura inválida.");
  const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext("2d");ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";
  const proporcaoFoto=bitmap.width/bitmap.height,proporcaoJanela=aw/ah;
  let sx=0,sy=0,sw=bitmap.width,sh=bitmap.height;
  if(proporcaoFoto>proporcaoJanela){sw=bitmap.height*proporcaoJanela;sx=(bitmap.width-sw)/2}
  else{sh=bitmap.width/proporcaoJanela;sy=(bitmap.height-sh)/2}
  ctx.drawImage(bitmap,sx,sy,sw,sh,x,y,aw,ah);
  ctx.drawImage(moldura,0,0,w,h);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",.93));
  if(!blob)throw Error("Não foi possível gerar a foto emoldurada.");
  return new File([blob],"entreclicks-emoldurada.jpg",{type:"image/jpeg"});
 }finally{bitmap.close?.()}
}
inputFoto.addEventListener("change",async()=>{
 arquivoPronto=null;previa.style.display="none";
 const file=inputFoto.files?.[0];if(!file)return;
 if(!configMoldura){status.textContent="Foto original selecionada. Este evento ainda não tem moldura.";return}
 if(file.size>8*1024*1024){status.textContent="Máximo de 8 MB.";return}
 botao.disabled=true;status.textContent="Preparando prévia com moldura...";
 try{
   arquivoPronto=await prepararFoto(file);
   previa.src=URL.createObjectURL(arquivoPronto);
   previa.style.display="block";
   status.textContent="Prévia pronta. Confira o enquadramento antes de enviar.";
 }catch(err){status.textContent=err.message}
 finally{botao.disabled=false}
});
form.addEventListener("submit",async e=>{e.preventDefault();const original=inputFoto.files[0];if(!original)return;if(configMoldura&&!arquivoPronto){status.textContent="Aguarde a prévia da moldura ficar pronta.";return}const f=configMoldura?arquivoPronto:original;if(f.size>8*1024*1024){status.textContent="Máximo de 8 MB.";return}botao.disabled=true;status.textContent="Enviando...";try{const body=new FormData();body.append("foto",f);const r=await fetch(endpoint,{method:"POST",headers:{"x-event-token":token},body});const d=await r.json();if(!r.ok)throw Error(d.error||"Falha no envio");status.textContent="Foto recebida com sucesso!";form.reset();arquivoPronto=null;previa.style.display="none"}catch(err){status.textContent=err.message}finally{botao.disabled=false;await verificar()}});
verificar();
</script></body></html>
