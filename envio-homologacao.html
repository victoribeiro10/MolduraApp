<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EntreClicks · Envio de fotos (Teste)</title><style>*{box-sizing:border-box}body{font-family:Inter,system-ui,sans-serif;background:#111820;color:#f8f4eb;min-height:100vh;margin:0;display:grid;place-items:center;padding:20px}main{width:min(100%,440px);border:1px solid #55504a;background:#202831;border-radius:18px;padding:30px}h1{margin:0 0 5px}.sub{color:#d6b47c;font-size:12px;letter-spacing:1px}p{line-height:1.5;color:#d4d8dc}input{width:100%;padding:15px;background:#121921;border:1px solid #65707c;border-radius:9px;color:white}button{background:#d6b47c;color:#1b1b1b;border:0;border-radius:9px;padding:14px;width:100%;font-weight:700;margin-top:18px}button:disabled{opacity:.55}#status{min-height:30px;font-size:14px}small{color:#aeb8c1}</style></head><body><main><h1>EntreClicks</h1><div class="sub">ENVIO DE FOTOS · HOMOLOGAÇÃO</div><h2 id="nome">Verificando evento...</h2><p id="descricao">Aguarde enquanto confirmamos o convite.</p><form id="envio" hidden><input id="foto" type="file" accept="image/jpeg,image/png,image/webp" required><button id="botao">Enviar foto</button></form><p id="status" role="status" aria-live="polite"></p><small>Ambiente de testes. Não envie fotos pessoais ou de clientes.</small></main><script>
const endpoint="https://aukbkykkoeovouflijlz.supabase.co/functions/v1/receber-foto-homologacao";
const token=new URLSearchParams(location.search).get("token")||"";
const nome=document.getElementById("nome"),desc=document.getElementById("descricao"),form=document.getElementById("envio"),status=document.getElementById("status"),botao=document.getElementById("botao");
async function verificar(){try{const r=await fetch(endpoint+"?token="+encodeURIComponent(token),{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Convite inválido");nome.textContent=d.nome;desc.textContent=d.recebendo_fotos&&d.status!=="encerrado"?"Escolha uma imagem de teste para enviar.":"Recebimento pausado para este evento.";form.hidden=!(d.recebendo_fotos&&d.status!=="encerrado")}catch(e){nome.textContent="Convite indisponível";desc.textContent=e.message}}
form.addEventListener("submit",async e=>{e.preventDefault();const f=document.getElementById("foto").files[0];if(!f)return;if(f.size>8*1024*1024){status.textContent="Máximo de 8 MB.";return}botao.disabled=true;status.textContent="Enviando...";try{const body=new FormData();body.append("foto",f);const r=await fetch(endpoint,{method:"POST",headers:{"x-event-token":token},body});const d=await r.json();if(!r.ok)throw Error(d.error||"Falha no envio");status.textContent="Foto recebida com sucesso!";form.reset()}catch(err){status.textContent=err.message}finally{botao.disabled=false;await verificar()}});
verificar();
</script></body></html>
