<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EntreClicks · Central do Operador</title><style>
:root{color-scheme:dark;--bg:#0c0c0c;--panel:#171717;--line:#3c3326;--gold:#c5a36b;--muted:#8a8580}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e5e0d8;font:12px Inter,Arial,sans-serif;letter-spacing:.03em}main{max-width:1250px;margin:auto;padding:6px 10px 35px}.box{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:15px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;min-height:65px}.brand{font-family:Georgia,serif;color:var(--gold);letter-spacing:3px;font-size:17px}.sub{font-family:Georgia,serif;font-style:italic;color:#777;font-size:11px;letter-spacing:1px}.small{font-size:10px;color:var(--muted);margin-top:6px}.eyebrow{font-size:10px;font-weight:700}.btn{background:#202020;border:1px solid #554630;border-radius:2px;color:#f5ead7;padding:13px 14px;cursor:pointer;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.btn:hover{border-color:var(--gold)}.btn:disabled{opacity:.45;cursor:not-allowed}.gold{background:var(--gold);color:#1b1711}.danger{background:#c96778;border-color:#c96778;color:#171111}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.receive{max-width:1080px;margin:0 auto 15px;padding:14px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.stat{display:flex;align-items:center;gap:16px;min-height:86px;border-left:3px solid var(--gold)}.ring{width:43px;height:43px;border:2px solid #9d8256;border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:20px}.num{font:32px Georgia,serif;color:var(--gold)}.moldura{display:flex;align-items:center;gap:12px;margin:15px 0}.moldura .info{flex:1}.heading{font:16px Georgia,serif;color:var(--gold);letter-spacing:1px;margin:20px 0 12px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);padding:5px;gap:4px;margin-top:12px}.tab{border:0;background:transparent;color:#888;padding:12px;cursor:pointer;font-size:10px;letter-spacing:1px}.tab.active{background:var(--gold);color:#1d1710;font-weight:700}.count{border-radius:12px;background:#3a3429;padding:2px 6px;margin-left:6px}.photos{min-height:195px;margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px;align-content:start}.empty{grid-column:1/-1;text-align:center;padding:55px 10px;color:var(--muted);font:italic 13px Georgia,serif}.photo{border:1px solid #4a3d2a;border-radius:4px;overflow:hidden;background:#101010}.photo img{display:block;width:100%;height:175px;object-fit:contain}.photo .missing{height:175px;display:grid;place-items:center;color:#aa8e63}.photo footer{padding:10px}.photo .buttons{display:flex;gap:5px;margin-top:8px}.photo button{flex:1;padding:8px 3px;font-size:9px}.notice{color:#c8a96d;min-height:20px;margin-top:10px}.event{color:#d6b986;font-weight:700}.hidden{display:none!important}@media(max-width:650px){.stats{grid-template-columns:1fr}.actions{grid-template-columns:1fr}.moldura{flex-wrap:wrap}.tabs{gap:0}.tab{font-size:9px;padding:10px 3px}.header{padding:12px}.brand{font-size:14px}}
</style></head><body><main>
<header class="box header"><div><div class="brand">ENTRE CLICKS</div><div class="sub">painel do operador · homologação</div><div class="small event" id="evento">Validando acesso...</div></div><button class="btn" id="sair">Sair</button></header>
<section class="box receive row"><div><div class="eyebrow" id="recebendo">Consultando recebimento...</div><div class="small">O QR Code do evento é exclusivo para seus convidados.</div></div><button class="btn" disabled title="A pausa individual ainda está em desenvolvimento" id="pausar">Pausar recebimento (em breve)</button></section>
<section class="stats"><div class="box stat"><div class="ring">◎</div><div><div class="num" id="total">—</div><div class="small">FOTOS NO SERVIDOR</div></div></div><div class="box stat"><div class="ring">▱</div><div><div class="num" id="espaco">—</div><div class="small">ESPAÇO UTILIZADO</div></div></div></section>
<section class="box moldura"><div class="ring">▧</div><div class="info"><div style="color:var(--gold);font-family:Georgia,serif;font-size:15px">Moldura Ativa</div><div class="small" id="moldura">Consultando moldura...</div></div><button class="btn" disabled title="Integração da galeria pendente">▤ Galeria de molduras</button><button class="btn gold" disabled title="Integração do ajuste de janela pendente">⚙ Ajustar janela</button></section>
<section class="actions"><button class="btn" id="atualizar">⟳ Atualizar lista</button><button class="btn" id="zip">⇩ Baixar pendentes em ZIP</button><button class="btn" disabled title="Exclusão em lote será habilitada após validação">♜ Apagar todas (em breve)</button></section>
<h2 class="heading">FOTOS ENVIADAS</h2><section class="box tabs"><button class="tab active" data-tab="pendentes">PENDENTES <span class="count" id="qpendentes">0</span></button><button class="tab" data-tab="baixadas">BAIXADAS <span class="count" id="qbaixadas">0</span></button><button class="tab" data-tab="todas">TODAS <span class="count" id="qtodas">0</span></button></section>
<section class="box photos" id="fotos"><div class="empty">Carregando fotos do evento...</div></section><div class="notice" id="aviso" role="status"></div>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.10/dist/umd/supabase.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
'use strict';
const sb=window.supabase.createClient('https://aukbkykkoeovouflijlz.supabase.co','sb_publishable_SZs299aBOzg9Xm_sKZXUiA_faIkIFXr',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);let eventoId=null,fotos=[],tab='pendentes',molduraUrl=null;
const aviso=t=>$('aviso').textContent=t;
async function iniciar(){const {data:{user}}=await sb.auth.getUser();if(!user){location.replace('./operador-login.html');return}
const {data,error}=await sb.from('operadores_evento').select('evento_id,perfil,eventos_operacao(nome,recebendo_fotos,moldura_url)').eq('usuario_id',user.id).order('evento_id').limit(2);
if(error||!data?.length){aviso('Nenhum evento autorizado.');return}
const membro=data.find(x=>x.perfil==='operador')||data[0];eventoId=membro.evento_id;$('evento').textContent=(membro.eventos_operacao?.nome||'Evento')+' · '+membro.perfil;
$('recebendo').textContent=membro.eventos_operacao?.recebendo_fotos?'Recebendo fotos dos convidados':'Recebimento de fotos pausado';
molduraUrl=membro.eventos_operacao?.moldura_url;$('moldura').textContent=molduraUrl?'Moldura cadastrada para este evento':'Moldura ainda não configurada neste teste';
await atualizar();}
async function atualizar(){if(!eventoId)return;aviso('Atualizando fotos...');const {data,error}=await sb.from('fotos_evento').select('id,arquivo_path,baixada,created_at').eq('evento_id',eventoId).order('created_at',{ascending:false}).limit(500);if(error){aviso('Falha ao consultar fotos.');return}fotos=data||[];$('total').textContent=fotos.length+(fotos.length===500?'+':'');$('espaco').textContent='—';$('qpendentes').textContent=fotos.filter(f=>!f.baixada).length;$('qbaixadas').textContent=fotos.filter(f=>f.baixada).length;$('qtodas').textContent=fotos.length;await render();aviso(fotos.length===500?'Mostrando as 500 fotos mais recentes.':'');}
async function baixarArquivo(f){const {data,error}=await sb.storage.from('fotos-eventos-teste').download(f.arquivo_path);if(error||!data)throw Error('Arquivo indisponível no armazenamento de testes.');return data}
function salvar(blob,nome){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=nome;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function nomeFoto(f){const ext=(f.arquivo_path.split('.').pop()||'jpg').toLowerCase();return 'EntreClicks-'+f.id+'.'+(['jpg','jpeg','png','webp'].includes(ext)?ext:'jpg')}
async function render(){const lista=fotos.filter(f=>tab==='todas'||(tab==='pendentes'?!f.baixada:f.baixada)),area=$('fotos');area.replaceChildren();if(!lista.length){const div=document.createElement('div');div.className='empty';div.textContent='Nenhuma foto nesta categoria';area.append(div);return}
for(const f of lista){const card=document.createElement('article');card.className='photo';const img=document.createElement('div');img.className='missing';img.textContent='Carregando foto...';card.append(img);const footer=document.createElement('footer');const data=document.createElement('div');data.className='small';data.textContent=new Date(f.created_at).toLocaleString('pt-BR')+' · '+(f.baixada?'Baixada':'Pendente');footer.append(data);const buttons=document.createElement('div');buttons.className='buttons';footer.append(buttons);card.append(footer);area.append(card);
const btnDownload=document.createElement('button');btnDownload.className='btn';btnDownload.textContent='Baixar';buttons.append(btnDownload);btnDownload.onclick=async()=>{btnDownload.disabled=true;try{salvar(await baixarArquivo(f),nomeFoto(f));aviso('Download solicitado: '+nomeFoto(f))}catch(e){aviso(e.message)}finally{btnDownload.disabled=false}};
const btnStatus=document.createElement('button');btnStatus.className='btn';btnStatus.textContent=f.baixada?'Pendente':'Marcar baixada';buttons.append(btnStatus);btnStatus.onclick=async()=>{btnStatus.disabled=true;const novo=!f.baixada;const {data,error}=await sb.from('fotos_evento').update({baixada:novo,data_baixada:novo?new Date().toISOString():null}).eq('id',f.id).eq('evento_id',eventoId).select('id').single();if(error||!data){aviso('Falha ao atualizar status.');btnStatus.disabled=false;return}f.baixada=novo;await atualizar()};
baixarArquivo(f).then(blob=>{if(!card.isConnected)return;const url=URL.createObjectURL(blob),preview=document.createElement('img');preview.src=url;preview.alt='Foto recebida';preview.onload=()=>URL.revokeObjectURL(url);preview.onerror=()=>URL.revokeObjectURL(url);img.replaceWith(preview)}).catch(()=>{img.textContent='Arquivo de teste indisponível'});}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
$('atualizar').onclick=atualizar;$('sair').onclick=async()=>{await sb.auth.signOut();location.replace('./operador-login.html')};
$('zip').onclick=async()=>{const pendentes=fotos.filter(f=>!f.baixada);if(!pendentes.length){aviso('Não há fotos pendentes.');return}if(!window.JSZip){aviso('Biblioteca ZIP indisponível.');return}const btn=$('zip');btn.disabled=true;const zip=new JSZip();let adicionadas=0;for(const f of pendentes){try{const b=await baixarArquivo(f);zip.file(nomeFoto(f),b);adicionadas++}catch{}}if(!adicionadas){aviso('Nenhuma foto disponível para compactar.');btn.disabled=false;return}aviso('Compactando '+adicionadas+' fotos...');try{salvar(await zip.generateAsync({type:'blob'}),'EntreClicks-pendentes.zip');aviso('ZIP gerado com '+adicionadas+' foto(s). O status não foi alterado.')}catch{aviso('Falha ao gerar ZIP.')}finally{btn.disabled=false}};
iniciar();
</script></body></html>
